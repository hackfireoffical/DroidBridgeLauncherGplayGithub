name: Android Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify Gradle project
        shell: bash
        run: |
          test -f gradlew || { echo "::error::gradlew is missing"; exit 1; }
          test -f settings.gradle || { echo "::error::settings.gradle is missing"; exit 1; }
          test -f app/build.gradle || test -f app/build.gradle.kts || {
            echo "::error::The app module has no app/build.gradle or app/build.gradle.kts."
            echo "The workflow is ready, but the Gradle app module must be restored before APKs can be built."
            exit 1
          }

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug
        if: github.event_name == 'push' || inputs.build_type == 'debug'
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || inputs.build_type == 'release'
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload debug APKs
        if: always() && (github.event_name == 'push' || inputs.build_type == 'debug')
        uses: actions/upload-artifact@v4
        with:
          name: DroidBridge-debug
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/*.apk
          if-no-files-found: warn

      - name: Upload release APKs
        if: always() && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || inputs.build_type == 'release')
        uses: actions/upload-artifact@v4
        with:
          name: DroidBridge-release
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/*.apk
          if-no-files-found: warn
