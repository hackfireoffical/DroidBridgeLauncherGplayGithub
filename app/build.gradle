plugins {
    id 'com.android.application'
}

android {
    namespace 'ca.dnamobile.droidbridgelauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'ca.dnamobile.droidbridgelauncher'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        multiDexEnabled true

        buildConfigField 'boolean', 'HARDENED_BUILD', 'false'
        buildConfigField 'boolean', 'ALLOW_OFFLINE_PROFILE_AUTH', 'true'

        manifestPlaceholders = [
                appAuthRedirectScheme: 'ca.dnamobile.droidbridgelauncher'
        ]
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            debuggable false
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    ndkVersion '27.2.12479018'

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
            jniLibs.srcDirs = ['src/main/libs']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.fragment:fragment:1.8.6'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'net.openid:appauth:0.11.1'
    implementation project(':nativeglfw')
}

tasks.register('prepareMethodInjectorAgent') {
    dependsOn ':methods_injector_agent:jar'
    doLast {
        def source = project(':methods_injector_agent').layout.buildDirectory.file('libs/methods_injector_agent.jar').get().asFile
        def target = file('src/main/assets/components/methods_injector_agent/methods_injector_agent.jar')
        target.parentFile.mkdirs()
        target.bytes = source.bytes
    }
}

preBuild.dependsOn tasks.named('prepareMethodInjectorAgent')
